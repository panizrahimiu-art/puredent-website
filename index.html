<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F4EDE5">
<title>Try the Look — Runway</title>
<meta name="description" content="Six looks, styled head to toe. Explore the runway, isolate a look, and tap a pin to see the piece.">
<link rel="preload" as="image" href="https://reel-ref-try-the-look.vercel.app/assets/model-1-640.webp" fetchpriority="high">
<style>
@font-face{font-family:Inter;src:url(https://reel-ref-try-the-look.vercel.app/assets/inter-600.woff2) format('woff2');font-weight:600;font-style:normal;font-display:swap}

/* ---------- reset ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;font-family:Helvetica,Arial,sans-serif;color:#382A2A;background:#fff}
body{overflow-x:hidden}
button,input,select{font:inherit}
a{color:inherit;text-decoration:none}
button{color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #382A2A;outline-offset:4px}
[hidden]{display:none!important}
main{display:block}
:root{color-scheme:light;
  --font-body--family:Helvetica,Arial,sans-serif;--font-body--weight:400;
  --font-heading--family:Helvetica,Arial,sans-serif;--font-heading--weight:400;
  --color-primary-button-background:#382A2A;--color-primary-button-text:#fff;
  --style-border-radius-buttons-primary:0px}

/* ---------- site header ---------- */
.site-header{height:88px;padding:0 40px;display:flex;flex-direction:row;align-items:center;gap:32px;border-bottom:1px solid #C99A9D;background:#fff;position:relative;z-index:50}
.brand{margin-right:auto;display:inline-flex}
.brand img{display:block;width:68px;height:24px;object-fit:contain}
.site-header nav{display:flex;gap:28px;font-size:14px;font-weight:600;font-family:Inter,Helvetica,Arial,sans-serif}
.site-header nav a{padding:12px 0}
.site-header nav a:hover{text-decoration:underline;text-underline-offset:4px}
#open-bag{display:flex;align-items:center;justify-content:center;gap:5px;min-width:44px;min-height:44px;background:none;border:0;cursor:pointer}
#open-bag span{font-size:10px}

/* ---------- section tokens ---------- */
runway-section{
  --rw-h:var(--rw-h-d);--rw-sub:var(--rw-sub-d);--rw-label:var(--rw-label-d);--rw-chip:var(--rw-chip-d);
  --rw-ph:var(--rw-ph-d);--rw-pt-size:var(--rw-pt-size-d);--rw-price:var(--rw-price-d);--rw-opt:var(--rw-opt-d);
  --rw-total:var(--rw-total-d);--rw-thumb:var(--rw-thumb-d);--rw-panel-pad:var(--rw-panel-pad-d);--rw-model-h:560px;
  --rw-stage:var(--rw-c-stage);--rw-panel:var(--rw-c-panel);--rw-text:var(--rw-c-text);--rw-head:var(--rw-c-text);
  --rw-muted:var(--rw-c-muted);--rw-accent:var(--rw-c-accent);--rw-on-accent:var(--rw-c-on-accent);--rw-line:var(--rw-c-line);
  --rw-btn-bg:var(--color-primary-button-background);--rw-btn-fg:var(--color-primary-button-text);
  --rw-ease:cubic-bezier(.16,1,.3,1);--rw-ease-silk:cubic-bezier(.65,0,.35,1);
  --rw-ease-spring:cubic-bezier(.34,1.56,.64,1);--rw-ease-sheet:cubic-bezier(.32,.72,0,1);
  --rw-pin-base:.15s;
  display:block;position:relative;color:var(--rw-text);background:var(--rw-panel);
  font-family:var(--font-body--family);font-weight:var(--font-body--weight);-webkit-font-smoothing:antialiased}
.rw__sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- frame + grid ---------- */
.rw__sticky{height:var(--rw-frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--rw-panel-w);grid-template-rows:minmax(0,1fr);width:100%;max-width:none;margin:0 auto}
.rw__left{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--rw-stage);overflow:hidden}
.rw__panel{position:relative;min-width:0;background:var(--rw-panel)}
.rw__panel.has-rule{border-left:1px solid var(--rw-line)}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- head ---------- */
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;position:relative;z-index:5}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-family:var(--rw-hf);font-weight:var(--rw-hw);font-size:var(--rw-h);line-height:1;letter-spacing:-.02em;color:var(--rw-head)}
.rw__sub{margin:0;font-size:var(--rw-sub);line-height:1.55;color:var(--rw-muted);max-width:46ch}

/* intro reveal */
.rw--js .rw__title,.rw--js .rw__sub,.rw--js .rw__panel-head{opacity:0;transform:translateY(22px);filter:blur(8px)}
.rw--js .rw__title{letter-spacing:.03em}
.rw--js.is-revealed .rw__title,.rw--js.is-revealed .rw__sub,.rw--js.is-revealed .rw__panel-head{opacity:1;transform:none;filter:none;transition:opacity 1.1s var(--rw-ease),transform 1.4s var(--rw-ease),filter 1.1s var(--rw-ease),letter-spacing 1.8s var(--rw-ease)}
.rw--js.is-revealed .rw__title{letter-spacing:-.02em;transition-delay:.12s}
.rw--js.is-revealed .rw__sub{transition-delay:.26s}
.rw--js.is-revealed .rw__panel-head{transition-delay:.34s}
.rw--js .rw__stage,.rw--js .rw__panel,.rw--js .rw__controls{opacity:0}
.rw--js.is-revealed .rw__stage{opacity:1;transition:opacity 1.6s ease .1s}
.rw--js.is-revealed .rw__panel{opacity:1;transition:opacity 1.2s ease .25s}
.rw--js.is-revealed .rw__controls{opacity:1;transition:opacity 1.2s ease .55s}

/* ---------- stage ---------- */
.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;overflow:hidden;z-index:0}
.is-dragging .rw__stage{cursor:grabbing}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px var(--rw-accent)}
.rw__actors,.rw__heroes{position:absolute;inset:0}
.rw__heroes{pointer-events:none;z-index:1500}
.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__figure{position:relative;height:var(--rw-model-h);width:calc(var(--rw-model-h) * var(--rw-ar,.5625));aspect-ratio:var(--rw-ar,.5625)}
.rw__art{position:absolute;inset:0;transform:translateY(calc(var(--rw-foot,0) * 100%))}
.rw__art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;pointer-events:none;user-select:none;-webkit-user-drag:none;opacity:0}
.rw__art img.is-decoded{opacity:1}
.rw__shadow{position:absolute;left:58%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);pointer-events:none;
  background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__hit{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:pointer}
.rw__hit:focus-visible{outline:2px solid var(--rw-accent);outline-offset:6px}

/* hero (the still, interactive copy of the front figure) */
.rw__hero{position:absolute;left:var(--rw-hx,72%);bottom:var(--rw-hy,30px);transform:translateX(-50%) scale(var(--rw-fs,1));transform-origin:50% 100%;opacity:0;visibility:hidden}
.rw__morph{position:relative}
.rw--still .rw__hero.is-on{opacity:1;visibility:visible;pointer-events:auto}
.rw__zoom{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:zoom-in}
.rw__pins{position:absolute;inset:0}
.rw--popup .rw__hero .rw__pins{display:none!important}

/* pins */
.rw__pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;background:transparent;border:0;padding:0;cursor:pointer;pointer-events:auto;z-index:2}
.rw__pin-dot{position:relative;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgb(255 255 255/.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#382A2A;font-size:11px;font-weight:600;line-height:1;box-shadow:0 4px 14px -4px rgb(0 0 0/.35);transition:transform .5s cubic-bezier(.2,1.6,.4,1),background .25s,color .25s,box-shadow .25s}
.rw__pin-dot::after,.rw__pin-dot::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgb(255 255 255/.8);pointer-events:none;animation:rw-ring 2.6s cubic-bezier(.2,.6,.3,1) infinite}
.rw__pin-dot::before{border-color:rgb(255 255 255/.55);animation-delay:1.3s}
.rw__pin:hover .rw__pin-dot,.rw__pin.is-hot .rw__pin-dot{transform:scale(1.3);background:var(--rw-accent);color:#fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--rw-accent) 22%,transparent),0 8px 20px -6px rgb(0 0 0/.45)}
.rw__pin:focus-visible{outline:0}
.rw__pin:focus-visible .rw__pin-dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--rw-accent)}
.rw__pin::after{content:attr(data-tip);position:absolute;left:calc(100% - 6px);top:50%;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 12px;border-radius:999px;
  background:rgb(255 255 255/.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#382A2A;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);
  opacity:0;transform:translate(-8px,-50%) scale(.96);transform-origin:left center;pointer-events:none;transition:opacity .35s,transform .6s var(--rw-ease)}
.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}
@media (hover:hover){.rw__pin:hover::after{opacity:1;transform:translate(0,-50%)}}

/* sweep */
.rw__sweep{position:absolute;inset:0;z-index:1550;mix-blend-mode:soft-light;pointer-events:none;overflow:hidden}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:42%;opacity:0;transform:translateX(-130%) skewX(-12deg);
  background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent)}
.rw__stage.is-sweep .rw__sweep::before{animation:rw-sweep 1.5s var(--rw-ease-silk)}

/* custom cursor */
.rw--cursor .rw__stage,.rw--cursor .rw__stage *{cursor:none!important}
.rw__cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:1700;pointer-events:none;will-change:transform}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#382A2A;
  border:1px solid color-mix(in srgb,#382A2A 28%,transparent);background:color-mix(in srgb,#fff 40%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transform:scale(.3);transition:transform .6s var(--rw-ease),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor-label{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;transition:opacity .25s,letter-spacing .7s var(--rw-ease)}
.rw__cursor-view{opacity:0}
.rw__cursor.is-on .rw__cursor-in{opacity:1;transform:scale(1)}
.rw__cursor.is-view .rw__cursor-drag{opacity:0}
.rw__cursor.is-view .rw__cursor-view{opacity:1}
.rw__cursor.is-link .rw__cursor-in{transform:scale(.2);background:var(--rw-accent);border-color:transparent}
.rw__cursor.is-link .rw__cursor-label{opacity:0}
.is-dragging .rw__cursor.is-on .rw__cursor-in{transform:scale(.74);background:var(--rw-accent);border-color:var(--rw-accent);color:#fff}
.is-dragging .rw__cursor-drag{letter-spacing:.42em}

/* phone progress line */
.rw__walk{display:none}

/* ---------- controls ---------- */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;position:relative;z-index:5}
.rw__icon{position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:#382A2A;cursor:pointer;flex:none}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s;pointer-events:none}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__icon[data-rw-prev]:hover svg{transform:translateX(-4px)}
.rw__icon[data-rw-next]:hover svg{transform:translateX(4px)}
.rw__icon:active svg{transform:scale(.88)}
.rw__icon:focus-visible{outline:2px solid var(--rw-accent);outline-offset:2px;border-radius:4px}
.rw__auto .i-pause{display:none}
.is-playing .rw__auto .i-pause{display:block}
.is-playing .rw__auto .i-play{display:none}
.rw__ticks{display:flex;flex:1;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;color:var(--rw-muted);text-align:left;background:none;border:0;padding:0;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:var(--rw-text)}
.rw__tick:hover{color:var(--rw-text)}
.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar{display:block;position:relative;width:100%;height:2px;overflow:hidden;background:color-mix(in srgb,#382A2A 14%,transparent);transition:transform .5s var(--rw-ease)}
.rw__tick-bar::after{content:"";position:absolute;inset:0;background:#382A2A;transform:scaleX(0);transform-origin:left center;transition:transform 1s var(--rw-ease),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);background:var(--rw-accent);opacity:1}
.is-playing .rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(0)}
.is-playing .rw__tick[aria-current="true"].is-run .rw__tick-bar::after{animation:rw-fill var(--rw-speed) linear forwards}
.rw__tick-label{display:block;font-size:10px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--rw-ease) .1s backwards}

/* ---------- panel ---------- */
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px var(--rw-panel-pad) 18px}
.rw__panel-title{margin:0;font-family:var(--rw-hf);font-weight:var(--rw-hw);font-size:var(--rw-ph);line-height:1.1;color:var(--rw-head)}
.rw__label{font-size:var(--rw-label);letter-spacing:.16em;text-transform:uppercase;color:var(--rw-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rw__label.is-swap{animation:rw-fade .8s var(--rw-ease)}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__mhead{display:none}
.rw__items{list-style:none;margin:0;padding:6px var(--rw-panel-pad) 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:var(--rw-thumb) minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0}
.has-dividers .rw__item{border-top:1px solid var(--rw-line)}
.has-dividers .rw__item:last-child{border-bottom:1px solid var(--rw-line)}
.rw__item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rw-accent);transform:scaleX(0);transform-origin:left center;transition:transform .9s var(--rw-ease);pointer-events:none}
.rw__item.is-hot::after{transform:scaleX(1)}
@media (hover:hover){.rw__item:hover::after{transform:scaleX(1)}}
.rw__media{display:block;position:relative;aspect-ratio:4/5;border-radius:var(--rw-thumb-radius);overflow:hidden;background:color-mix(in srgb,#382A2A 5%,#fff)}
.rw__media img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1.4s var(--rw-ease)}
@media (hover:hover){.rw__item:hover .rw__media img{transform:scale(1.07)}}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.9);color:#382A2A;font-size:10px;font-weight:600;line-height:1;
  transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-hot .rw__num{background:var(--rw-accent);color:#fff;transform:scale(1.12)}
@media (hover:hover){.rw__item:hover .rw__num{background:var(--rw-accent);color:#fff;transform:scale(1.12)}}
.rw__tag{position:absolute;top:calc(var(--rw-tag-top) - 7px);left:calc(var(--rw-tag-left) + 8px);z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,#382A2A 50%,transparent)}
.rw__tag-text{align-self:flex-start;background:#382A2A;color:var(--rw-panel);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
@media (hover:hover){.rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rw-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw__name{align-self:flex-start;font-size:var(--rw-pt-size);font-weight:500;line-height:1.3;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--rw-ease)}
.rw__name:hover{background-size:100% 1px}
.rw__price{display:flex;gap:8px;font-size:var(--rw-price)}

/* add button */
.rw__add{position:relative;width:44px;height:44px;display:grid;align-self:end;background:none;border:0;cursor:pointer;color:var(--rw-text)}
.rw__add::before{content:"";position:absolute;inset:4px;border-radius:var(--rw-add-radius);border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s;pointer-events:none}
.rw__add:hover::before,.rw__item.is-picking .rw__add::before{opacity:.22;transform:scale(1)}
.rw__add svg{grid-area:1/1;place-self:center;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add .i-check,.rw__add .i-spin{opacity:0}
.rw__add .i-check path{stroke-dasharray:24;stroke-dashoffset:24}
.rw__item.is-picking .rw__add .i-plus{transform:rotate(45deg)}
.rw__item.is-loading .rw__add .i-plus{opacity:0}
.rw__item.is-loading .rw__add .i-spin{opacity:1;animation:rw-spin .8s linear infinite}
.rw__item.is-loading .rw__media::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.5) 50%,transparent 70%);animation:rw-shimmer 1.1s ease-in-out infinite}
.rw__item.is-added .rw__add .i-plus{opacity:0}
.rw__item.is-added .rw__add .i-check{opacity:1;color:var(--rw-accent);animation:rw-pop .6s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-added .rw__add .i-check path{stroke-dashoffset:0;transition:stroke-dashoffset .7s var(--rw-ease) .1s}
.rw__item.is-added .rw__add::before{opacity:0}
.rw__item.is-added .rw__add::after{content:"";position:absolute;inset:4px;border-radius:var(--rw-add-radius);border:1px solid var(--rw-accent);pointer-events:none;animation:rw-burst 1s var(--rw-ease) forwards}

/* picker (inline on desktop, bottom sheet on phones) */
.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:rw-drop .7s var(--rw-ease)}
.rw__picker-head{display:none}
.rw__opt{border:0;padding:0;margin:0;min-width:0;animation:rw-rise .8s var(--rw-ease)}
.rw__opt-name{display:block;padding:0;margin-bottom:8px;font-size:var(--rw-opt,11px);color:var(--rw-text)}
.rw__opt-values{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative;display:inline-flex}
.rw__pill input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.rw__pill-label{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:var(--rw-pill-radius,30px);border:1px solid var(--rw-line);background:transparent;color:var(--rw-text);font-size:var(--rw-opt,11px);
  transition:background .3s,color .3s,border-color .3s,transform .45s var(--rw-ease-spring),box-shadow .45s}
.rw__pill:hover .rw__pill-label{border-color:var(--rw-text)}
.rw__pill input:checked + .rw__pill-label{background:var(--rw-text);color:var(--rw-panel,#fff);border-color:var(--rw-text)}
.rw__pill:active .rw__pill-label{transform:scale(.94)}
.rw__pill input:focus-visible + .rw__pill-label{outline:2px solid var(--rw-accent);outline-offset:2px}
.rw__pill.is-unavailable .rw__pill-label{color:var(--rw-muted);background:linear-gradient(to top right,transparent calc(50% - .5px),var(--rw-line) calc(50% - .5px),var(--rw-line) calc(50% + .5px),transparent calc(50% + .5px))}

class RunwaySection extends HTMLElement {

    const $ = (s, c = root) => c.querySelector(s);

      msgSold: D.msgSoldout || 'Sold out'
    };
    const FEEL = { soft:[60, .06], balanced:[95, .04], snappy:[140, .025] };
    const [K, LAG] = FEEL[D.feel] || FEEL.balanced;
    const C = 2 * Math.sqrt(K);

    const n = LOOKS.length, NB = n * Math.ceil(8 / n);
    const wrapN = v => ((v % NB) + NB) % NB;
    const START = reduce ? 0 : 1.15;

    const offs = [];
    const on = (t, ev, fn, o) => { t.addEventListener(ev, fn, o); offs.push(() => t.removeEventListener(ev, fn, o)); };

    /* ---------- build the DOM ---------- */
    const actors = $('[data-rw-actors]'), heroesBox = $('[data-rw-heroes]'), stage = $('[data-rw-stage]');
    const ticksBox = $('.rw__ticks'), panelEl = $('.rw__panel'), panelInner = $('.rw__panel-inner');
    const lb = $('[data-rw-lb]'), lbStage = $('[data-rw-lb-stage]'), liveEl = $('[data-rw-live]');
    const piecesEl = $('[data-rw-pieces]'), cursorEl = $('[data-rw-cursor]'), autoBtn = $('[data-rw-auto]');

    actors.innerHTML = LOOKS.map(bodyHTML).join('');
    for (let a = n; a < NB; a++) {
      const c = actors.children[a % n].cloneNode(true);
      c.setAttribute('data-rw-clone', '');
      $$('img', c).forEach(im => { im.loading = 'lazy'; });
      actors.appendChild(c);
    }
    heroesBox.innerHTML = LOOKS.map(heroHTML).join('');
    ticksBox.innerHTML = LOOKS.map(tickHTML).join('');
    $$('.rw__look-panel', panelInner).forEach(p => p.remove());
    panelInner.insertAdjacentHTML('beforeend', LOOKS.map(panelHTML).join(''));

    });
    on(root, 'change', e => { const pk = e.target.closest('[data-rw-picker]'); if (pk && pk._card) onOption(pk); });
    on(panelEl, 'click', e => { if (e.target.closest('button,a,input,select,label')) engage(); });
    on(panelEl, 'change', engage);
    on(panelEl, 'pointerenter', e => { if (e.pointerType === 'mouse') panelHover = true; });
    on(panelEl, 'pointerleave', e => { if (e.pointerType === 'mouse') { panelHover = false; restartBar(); } });
    on(panelEl, 'pointerover', e => {
      if (e.pointerType !== 'mouse') return;
      const c = e.target.closest('[data-rw-card]'); if (c) hot(+c.dataset.rwCard);
    });
    on(panelEl, 'pointerout', e => {
      if (e.pointerType !== 'mouse') return;
      const c = e.target.closest('[data-rw-card]'); if (c && !c.contains(e.relatedTarget)) clearHot();
    });
    on(root, 'keydown', e => {
      if (e.key === 'Escape') { if (sheet) { closeSheet(true); return; } if (lbOpen) closeLB(); }
    });
    on(stage, 'keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    });
    on(stage, 'click', e => { if (performance.now() < suppressUntil) { e.stopPropagation(); e.preventDefault(); } }, true);

    /* ---------- drag / swipe ---------- */
    let pd = null;
    on(stage, 'pointerdown', e => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pd = { x:e.clientX, y:e.clientY, t:target, id:e.pointerId, s:[{ x:e.clientX, t:e.timeStamp }], mouse:e.pointerType === 'mouse' };
    });
    on(stage, 'pointermove', e => {
      cursorMove(e);
      if (!pd || e.pointerId !== pd.id) return;
      if (pd.mouse && e.buttons === 0) { endDrag(e); return; }
      const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
      pd.s.push({ x:e.clientX, t:e.timeStamp }); if (pd.s.length > 6) pd.s.shift();
      if (!dragging) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > 1.2 * Math.abs(dy)) {
          dragging = true; root.classList.add('is-dragging');
          try { stage.setPointerCapture(e.pointerId); } catch (err) {}
          setStill(false); renderAll();
          cursorState(e);
        } else if (Math.abs(dy) > 10) { pd = null; return; }
      }
      if (dragging) { target = pd.t - dx / unit; kick(); }
    });
    function endDrag(e){
      if (!pd) return;
      const p = pd; pd = null;
      if (!dragging) return;
      dragging = false; root.classList.remove('is-dragging');
      suppressUntil = performance.now() + 60;
      try { stage.releasePointerCapture(p.id); } catch (err) {}
      const dx = e.clientX - p.x, f = p.s[0], l = p.s[p.s.length - 1];
      const vx = l.t > f.t ? (l.x - f.x) / (l.t - f.t) : 0;
      const from = Math.round(p.t);
      if (mobile) {
        if (Math.abs(dx) > 30 || Math.abs(vx) > .3) moveTo(from + (dx > 0 ? -1 : 1)); else moveTo(from);
      } else {
        let i = Math.round(target - vx * 160 / unit);
        if (i === from && Math.abs(vx) > .3) i = from + (vx < 0 ? 1 : -1);
        moveTo(clamp(i, from - 2, from + 2));
      }
    }
    on(stage, 'pointerup', endDrag);
    on(stage, 'pointercancel', endDrag);

    /* ---------- trackpad ---------- */
    let wheelAcc = 0, wheelLock = false;
    on(stage, 'wheel', e => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
      e.preventDefault();
      if (wheelLock) return;
      wheelAcc += e.deltaX;
      if (Math.abs(wheelAcc) > 45) {
        if (wheelAcc > 0) next(); else prev();
        wheelAcc = 0; wheelLock = true; setTimeout(() => { wheelLock = false; }, 520);
      }
    }, { passive:false });

    /* ---------- custom cursor ---------- */
    let ccx = 0, ccy = 0, ctx_ = 0, cty = 0, cOn = false, cRaf = 0;
    function cursorState(e){
      const t = e.target;
      const link = !dragging && !!t.closest('.rw__pin, .rw__hit');
      cursorEl.classList.toggle('is-link', link);
      cursorEl.classList.toggle('is-view', !dragging && !link && !!t.closest('.rw__zoom'));
    }
    function cursorLoop(){
      cRaf = 0;
      const k = reduce ? 1 : .18;
      ccx += (ctx_ - ccx) * k; ccy += (cty - ccy) * k;
      if (Math.abs(ctx_ - ccx) < .2 && Math.abs(cty - ccy) < .2) { ccx = ctx_; ccy = cty; }
      else cRaf = requestAnimationFrame(cursorLoop);
      cursorEl.style.transform = `translate3d(${ccx.toFixed(1)}px,${ccy.toFixed(1)}px,0)`;
    }
    function cursorMove(e){
      if (!finePointer || e.pointerType !== 'mouse') return;
      const r = stage.getBoundingClientRect();
      ctx_ = e.clientX - r.left; cty = e.clientY - r.top;
      if (!cOn) { cOn = true; ccx = ctx_; ccy = cty; cursorEl.classList.add('is-on'); }
      cursorState(e);
      if (!cRaf) cRaf = requestAnimationFrame(cursorLoop);
    }
    if (finePointer) on(stage, 'pointerleave', () => { cOn = false; cursorEl.classList.remove('is-on', 'is-link', 'is-view'); });

    /* ---------- images: decode + feet detection ---------- */
    function decodeImg(img){
      const ok = () => img.classList.add('is-decoded');
      if (img.decode) img.decode().then(ok, () => { if (img.naturalWidth) ok(); else img.addEventListener('load', ok, { once:true }); });
      else if (img.complete) ok(); else img.addEventListener('load', ok, { once:true });
    }
    $$('img[data-model-image]').forEach(decodeImg);
    LOOKS.forEach((L, i) => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => {
        try {
          const w = 48, h = Math.max(1, Math.round(w * im.naturalHeight / im.naturalWidth));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx2 = cv.getContext('2d', { willReadFrequently:true });
          cx2.drawImage(im, 0, 0, w, h);
          const px = cx2.getImageData(0, 0, w, h).data;
          let lastRow = -1;
          for (let y = h - 1; y >= 0 && lastRow < 0; y--) for (let x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 40) { lastRow = y; break; }
          if (lastRow < 0) return;
          const f = clamp((h - 1 - lastRow) / h, 0, .4);
          heroes[i].style.setProperty('--rw-foot', f);
          bodies.forEach(s => { if (s.a % n === i) s.el.style.setProperty('--rw-foot', f); });
        } catch (err) { /* tainted canvas: keep offset 0 */ }
      };
      im.src = heroes[i].dataset.probe;
    });

    /* ---------- observers + lifecycle ---------- */
    const vis = new IntersectionObserver(es => {
      visible = es[es.length - 1].isIntersecting;
      if (visible) { kick(); restartBar(); } else if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }, { threshold: 0 });
    vis.observe(root);

    const doReveal = () => {
      revealed = true;
      root.classList.add('is-revealed');
      kick();
    };
    let revObs = null;
    if (reduce) { revealed = true; root.classList.add('is-revealed'); }
    else {
      revObs = new IntersectionObserver(es => {
        if (es.some(x => x.isIntersecting)) {
          revObs.disconnect(); revObs = null;
          requestAnimationFrame(() => requestAnimationFrame(doReveal));
        }
      }, { threshold: 0, rootMargin: '0px 0px -22% 0px' });
      revObs.observe(root);
    }

    let rzT = 0;
    on(window, 'resize', () => { clearTimeout(rzT); rzT = setTimeout(measure, 120); });
    const ro = new ResizeObserver(() => measure());
    ro.observe(stage);
    on(document, 'visibilitychange', () => { if (!document.hidden) { kick(); restartBar(); } });

    // init
    initClassic(START);
    measure();
    setIndex(0, true);
    renderAll();
    if (cfg.autoplay && !reduce) play(true);
    if (revealed) kick();

    this._off = () => {
      cancelAnimationFrame(raf); cancelAnimationFrame(cRaf);
      clearTimeout(timer); clearTimeout(rzT); clearTimeout(lbT);
      vis.disconnect(); ro.disconnect(); if (revObs) revObs.disconnect();
      offs.forEach(f => f());
      closeSheet();
    };
  }
}
customElements.define('runway-section', RunwaySection);
})();
</script>
